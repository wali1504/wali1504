<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="55%" stop-color="#0d1530"/>
      <stop offset="100%" stop-color="#140b2e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#a78bfa;#67e8f9" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="360" rx="22"/></clipPath>
    <style>
      .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse2 { animation: pulse 3s ease-in-out 1s infinite; transform-box: fill-box; transform-origin: center; }
      .pulse3 { animation: pulse 3s ease-in-out 2s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
      .flow { stroke-dasharray: 6 10; animation: flow 2.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .float { animation: float 8s ease-in-out infinite; }
      .float2 { animation: float 10s ease-in-out 2s infinite reverse; }
      @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-18px); } }
      .fadeUp { animation: fadeUp 1.2s ease-out both; }
      .fadeUp2 { animation: fadeUp 1.2s ease-out .3s both; }
      .fadeUp3 { animation: fadeUp 1.2s ease-out .6s both; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- glows -->
    <circle class="float" cx="980" cy="90" r="260" fill="url(#glowV)"/>
    <circle class="float2" cx="160" cy="330" r="240" fill="url(#glowC)"/>

    <!-- scan light -->
    <rect class="scan" x="0" y="0" width="160" height="360" fill="#ffffff" opacity="0.025" transform="skewX(-20)"/>

    <!-- neural network (right) -->
    <g transform="translate(830,60)" stroke-width="1.6" fill="none">
      <g stroke="url(#line)" stroke-opacity="0.55">
        <path class="flow" d="M20 40 L140 20 M20 40 L140 120 M20 40 L140 220 M20 140 L140 20 M20 140 L140 120 M20 140 L140 220 M20 240 L140 120 M20 240 L140 220"/>
        <path class="flow" d="M140 20 L260 70 M140 20 L260 170 M140 120 L260 70 M140 120 L260 170 M140 220 L260 70 M140 220 L260 170"/>
        <path class="flow" d="M260 70 L330 120 M260 170 L330 120"/>
      </g>
      <g filter="url(#soft)">
        <circle class="pulse"  cx="20"  cy="40"  r="7" fill="#22d3ee"/>
        <circle class="pulse2" cx="20"  cy="140" r="7" fill="#22d3ee"/>
        <circle class="pulse3" cx="20"  cy="240" r="7" fill="#22d3ee"/>
        <circle class="pulse2" cx="140" cy="20"  r="8" fill="#60a5fa"/>
        <circle class="pulse3" cx="140" cy="120" r="8" fill="#60a5fa"/>
        <circle class="pulse"  cx="140" cy="220" r="8" fill="#60a5fa"/>
        <circle class="pulse"  cx="260" cy="70"  r="8" fill="#a78bfa"/>
        <circle class="pulse2" cx="260" cy="170" r="8" fill="#a78bfa"/>
        <circle class="pulse3" cx="330" cy="120" r="11" fill="#c084fc"/>
      </g>
      <text x="330" y="152" fill="#c4b5fd" font-size="11" text-anchor="middle" letter-spacing="2" opacity="0.8">AI</text>
    </g>

    <!-- terminal-style tag -->
    <g transform="translate(70,46)"><g>
      <rect width="350" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5"/>
      <circle class="blink" cx="20" cy="16" r="5" fill="#34d399"/>
      <text x="36" y="21" fill="#6ee7b7" font-size="13" font-weight="600" letter-spacing="1.5">AVAILABLE · INTERNATIONAL CLIENTS</text>
    </g></g>

    <!-- name -->
    <g>
      <text x="68" y="160" fill="url(#nameGrad)" font-size="66" font-weight="800" letter-spacing="-1">Wali Ullah Siddique</text>
      <rect x="70" y="180" width="120" height="4" rx="2" fill="url(#line)"/>
      <text x="70" y="222" fill="#e2e8f0" font-size="24" font-weight="600">Full Stack AI &amp; Automation Engineer
        <tspan fill="#64748b"> · </tspan><tspan fill="#c4b5fd">Solutions Architect</tspan></text>
    </g>

    <!-- chips -->
    <g font-size="14" font-weight="600">
      <g transform="translate(70,252)">
        <rect width="118" height="34" rx="9" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
        <text x="59" y="22" fill="#67e8f9" text-anchor="middle">⚡ 5+ Years</text>
      </g>
      <g transform="translate(200,252)">
        <rect width="150" height="34" rx="9" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.45"/>
        <text x="75" y="22" fill="#93c5fd" text-anchor="middle">🤖 LLMs &amp; AI Agents</text>
      </g>
      <g transform="translate(362,252)">
        <rect width="150" height="34" rx="9" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
        <text x="75" y="22" fill="#c4b5fd" text-anchor="middle">📚 RAG Pipelines</text>
      </g>
      <g transform="translate(524,252)">
        <rect width="184" height="34" rx="9" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.45"/>
        <text x="92" y="22" fill="#f9a8d4" text-anchor="middle">⚙️ Workflow Automation</text>
      </g>
      <g transform="translate(720,252)">
        <rect width="150" height="34" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
        <text x="75" y="22" fill="#6ee7b7" text-anchor="middle">☁️ Cloud &amp; Scale</text>
      </g>
    </g>

    <!-- footer line -->
    <text x="70" y="326" fill="#64748b" font-size="13" letter-spacing="3" font-family="Consolas, 'Courier New', monospace">&gt; automate the repetitive · architect the scalable · build what matters<tspan class="blink" fill="#22d3ee">_</tspan></text>

    <rect x="0.5" y="0.5" width="1199" height="359" rx="22" fill="none" stroke="url(#line)" stroke-opacity="0.35"/>
  </g>
</svg>
